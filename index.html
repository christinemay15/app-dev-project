<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            text-align: center;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Information</h1>

        <input type="text" id="name" placeholder="Enter your name">
        <input type="text" id="course" placeholder="Enter your course">

        <button onclick="showInfo()">Submit</button>

        <p id="result"></p>
    </div>

    <script>
        function showInfo() {
            let name = document.getElementById("name").value;
            let course = document.getElementById("course").value;

            document.getElementById("result").innerHTML =
                "Name: " + name + "<br>Course: " + course;
        }
    </script>

</body>
</html
